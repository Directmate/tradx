<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeX | Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            TradeX
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address and we will send you a password reset link.
        </p>

        <div id="message" class="message"></div>

        <form id="forgotForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <button
                type="submit"
                id="resetButton">

                Send Reset Link

            </button>

        </form>

        <div class="back">
            <a href="/login.html">
                ← Back to Login
            </a>
        </div>

    </div>

</div>


<script>

const forgotForm =
    document.getElementById("forgotForm");

const resetButton =
    document.getElementById("resetButton");

const message =
    document.getElementById("message");


forgotForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.style.display = "none";

        const email =
            document.getElementById("email").value
            .trim()
            .toLowerCase();


        resetButton.disabled = true;

        resetButton.textContent =
            "Sending...";


        try {

            const response =
                await fetch(
                    "/api/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to send reset link."
                );

            }


            message.className =
                "message success";

            message.textContent =
                "If this email is registered, a password reset link has been sent. Please check your inbox and spam folder.";

            message.style.display =
                "block";


            forgotForm.reset();


        } catch (error) {

            message.className =
                "message error";

            message.textContent =
                error.message;

            message.style.display =
                "block";

        } finally {

            resetButton.disabled = false;

            resetButton.textContent =
                "Send Reset Link";

        }

    }
);

</script>

</body>
</html>
