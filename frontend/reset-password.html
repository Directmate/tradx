<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeX | Reset Password</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 35px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: #111827;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Reset Password</h1>

            <p class="subtitle">
                Enter your new password below.
            </p>

            <div id="message" class="message"></div>

            <form id="resetForm">

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="resetButton">

                    Reset Password

                </button>

            </form>

            <div class="back">

                <a href="/login.html">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>

<script>

const resetForm = document.getElementById("resetForm");
const resetButton = document.getElementById("resetButton");
const message = document.getElementById("message");


// Get token from URL
const urlParams = new URLSearchParams(window.location.search);
const resetToken = urlParams.get("token");


// Check token
if (!resetToken) {

    message.className = "message error";
    message.textContent = "Invalid or missing password reset link.";
    message.style.display = "block";

    resetButton.disabled = true;
}


// Submit reset password
resetForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.style.display = "none";


    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    // Password match check
    if (newPassword !== confirmPassword) {

        message.className = "message error";
        message.textContent = "Passwords do not match.";
        message.style.display = "block";

        return;
    }


    if (newPassword.length < 6) {

        message.className = "message error";
        message.textContent =
            "Password must be at least 6 characters.";

        message.style.display = "block";

        return;
    }


    resetButton.disabled = true;
    resetButton.textContent = "Resetting...";


    try {

        const response = await fetch(
            "/api/reset-password",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    token: resetToken,
                    newPassword: newPassword
                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Password reset failed."
            );

        }


        message.className = "message success";

        message.textContent =
            "Password reset successful. Redirecting to login...";

        message.style.display = "block";


        resetForm.reset();


        setTimeout(() => {

            window.location.href = "/login.html";

        }, 2000);


    } catch (error) {

        message.className = "message error";

        message.textContent =
            error.message;

        message.style.display = "block";


    } finally {

        resetButton.disabled = false;

        resetButton.textContent =
            "Reset Password";

    }

});

</script>
</body>

</html>
