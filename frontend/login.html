<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeX | Login</title>

    <link rel="stylesheet" href="./css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 35px;
        }

        .login-logo {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        /* Forgot Password */
        .forgot-password {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Register section */
        .register-section {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }

        .register-section a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-section a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                TradeX
            </div>

            <p class="login-subtitle">
                Sign in to your paper trading account
            </p>

            <div
                id="loginError"
                class="error-message">
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="/forgot-password.html">
                        Forgot Password?
                    </a>
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    Login

                </button>

            </form>

            <!-- Register -->
            <div class="register-section">
                Don't have an account?
                <a href="/register.html">
                    Create Account
                </a>
            </div>

        </div>

    </div>

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const loginError =
            document.getElementById("loginError");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                loginError.style.display = "none";

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                loginButton.disabled = true;

                loginButton.textContent = "Logging in...";


                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Login failed."
                        );

                    }


                    // Save JWT token
                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    // Save user information
                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );


                    // Open dashboard
                    window.location.href = "/";

                } catch (error) {

                    loginError.textContent =
                        error.message;

                    loginError.style.display =
                        "block";

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>
</html>
